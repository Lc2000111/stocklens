<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock · StockLens</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #fdf3f8;
    --border: #efdbe5;
    --pink: #e0197d;
    --pink-soft: #ec5a9e;
    --pink-dim: #f2a3c7;
    --text: #1d1218;
    --muted: #76626c;
    --up: #15803d;
    --down: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  /* Header + search */
  header { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--pink); }
  .nav { display: flex; gap: 6px; }
  .nav a { color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 999px; }
  .nav a:hover { color: var(--pink); }
  .nav a.on { color: #ffffff; background: var(--pink); }
  .search { position: relative; flex: 1; min-width: 280px; }
  .search input {
    width: 100%; padding: 13px 16px 13px 44px; font-size: 16px;
    background: var(--panel); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 12px; outline: none;
  }
  .search input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(224, 25, 125,0.18); }
  .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .suggestions {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50;
    background: #ffffff; border: 1px solid var(--pink-dim); border-radius: 12px;
    box-shadow: 0 10px 28px rgba(29, 18, 24, 0.16); overflow: hidden; display: none;
  }
  .suggestion.note { color: var(--muted); cursor: default; font-size: 14px; }
  .suggestion.note:hover { background: transparent; }
  .suggestions.open { display: block; }
  .suggestion { padding: 10px 16px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; }
  .suggestion:hover, .suggestion.active { background: rgba(224, 25, 125,0.12); }
  .suggestion b { color: var(--pink); min-width: 70px; }
  .suggestion small { color: var(--muted); margin-left: auto; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .chip {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .chip:hover { color: var(--pink); border-color: var(--pink); }

  /* Hero */
  .hero { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
  .hero h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; }
  .hero .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .hero .meta .tag { color: var(--pink-soft); }
  .price { text-align: right; }
  .price .now { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
  .price .chg { font-size: 16px; font-weight: 600; }
  .up { color: var(--up); } .down { color: var(--down); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }

  /* Chart */
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .chart-head h3 { margin: 0; }
  .periods { display: flex; gap: 4px; }
  .periods button {
    background: transparent; border: none; color: var(--muted); font-weight: 700;
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .periods button.on { background: var(--pink); color: #ffffff; }
  .periods button:hover:not(.on) { color: var(--pink); }
  #chart { width: 100%; height: 300px; display: block; }
  #rsi { width: 100%; height: 160px; display: block; }
  .chart-tip { fill: var(--text); font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend button {
    display: flex; align-items: center; gap: 7px; background: transparent; cursor: pointer;
    border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;
  }
  .legend button i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend button small { color: var(--muted); font-weight: 500; }
  .legend button.off { opacity: 0.35; }
  .sub-head { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 4px; }
  .sub-head h3 { margin: 0; }
  .sub-head .rsi-now { font-weight: 700; font-size: 14px; }
  .signals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 14px; }
  .signal { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
  .signal .k { color: var(--muted); font-size: 12px; cursor: help; }
  .signal .v { font-weight: 700; margin-top: 2px; }
  .pink { color: var(--pink); }

  /* Metrics */
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--pink); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-top: 16px; }
  .metric { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); gap: 12px; }
  .metric:last-child { border-bottom: none; }
  .metric .label { color: var(--muted); cursor: help; border-bottom: 1px dotted transparent; }
  .metric .label:hover { color: var(--text); border-bottom-color: var(--pink-dim); }
  .metric .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .na { color: #b3a3ab; font-weight: 500 !important; }

  /* Key stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0 0; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; }
  .tile .v { font-size: 24px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile.accent { border-color: var(--pink-dim); background: linear-gradient(160deg, #fde7f1, var(--panel)); }
  .tile.accent .v { color: var(--pink); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }

  .rangebar { position: relative; height: 6px; background: var(--border); border-radius: 3px; margin: 10px 0 6px; }
  .rangebar .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--pink); transform: translate(-50%, -50%); box-shadow: 0 0 10px var(--pink); }
  .rangelabels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

  .about { color: var(--muted); font-size: 14px; }
  .about a { color: var(--pink-soft); }
  .rec { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--pink); color: #ffffff; font-weight: 800; text-transform: uppercase; font-size: 12px; letter-spacing: 0.6px; }

  .status { text-align: center; color: var(--muted); padding: 80px 0; }
  .status.error { color: var(--down); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--pink); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: #b3a3ab; font-size: 12px; margin-top: 30px; text-align: center; }

  .panel, .tile { box-shadow: 0 1px 3px rgba(29, 18, 24, 0.06); }

  /* Valuation vs. its own 5-year history */
  .val-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .val-head h3 { margin: 0; }
  .verdict { font-weight: 800; font-size: 16px; }
  .verdict.hi { color: var(--pink); } .verdict.lo { color: var(--up); } .verdict.mid { color: var(--text); }
  .val-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .vcard { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: #fff; }
  .vcard.hi { border-color: var(--pink-dim); background: linear-gradient(160deg, #fde7f1, #fff); }
  .vcard.lo { border-color: #86efac; background: linear-gradient(160deg, #ecfdf3, #fff); }
  .vcard .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; }
  .vcard .row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
  .vcard .now { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .vcard .pc { font-size: 18px; font-weight: 800; }
  .vcard.hi .pc { color: var(--pink); } .vcard.lo .pc { color: var(--up); } .vcard.mid .pc { color: var(--muted); }
  .vcard .bar { height: 7px; background: var(--panel-2); border-radius: 4px; margin: 8px 0 6px; overflow: hidden; }
  .vcard .bar span { display: block; height: 100%; border-radius: 4px; background: #c9b8c2; }
  .vcard.hi .bar span { background: linear-gradient(90deg, var(--pink-dim), var(--pink)); }
  .vcard.lo .bar span { background: linear-gradient(90deg, #86efac, var(--up)); }
  .vcard .sub { color: var(--muted); font-size: 12.5px; }
  .val-charts { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
  .val-charts h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .val-charts svg { width: 100%; height: 170px; display: block; }
  .mini-seg { display: inline-flex; gap: 4px; margin-left: 8px; }
  .mini-seg button { border: 1px solid var(--border); background: #fff; color: var(--muted); border-radius: 999px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; cursor: pointer; }
  .mini-seg button.on { background: var(--pink); color: #fff; border-color: var(--pink); }
  .val-foot { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .val-foot a { color: var(--pink); font-weight: 700; text-decoration: none; }


  /* ---------- Phones ---------- */
  @media (max-width: 700px) {
    .wrap { padding: 16px 14px 40px; }
    header { flex-wrap: wrap; gap: 10px 16px; margin-bottom: 16px; }
    header nav, header .nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    header nav::-webkit-scrollbar, header .nav::-webkit-scrollbar { display: none; }
    header nav a, header .nav a { white-space: nowrap; flex: none; padding: 6px 12px; }
    h1 { font-size: 24px; }
    .sub { font-size: 14px; }
    header .search { order: 2; width: 100%; min-width: 0; flex: 1 1 100%; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile .v { font-size: 19px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .val-cards, .val-charts { grid-template-columns: minmax(0, 1fr); }
    .hero .price { text-align: left; }
    .chart-head { flex-wrap: wrap; gap: 8px; }
    .panel table { display: block; overflow-x: auto; }
  }
</style>
<script src="/static/md.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Stock<span>Lens</span></div>
    <nav class="nav"><a href="/">Market</a><a href="/stock" class="on">Stock</a><a href="/screener">P/E Screener</a><a href="/ask">Ask AI</a><a href="/statement">Income Statement</a></nav>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search a ticker or company (e.g. NVDA, Costco)…" autocomplete="off" />
      <div id="suggestions" class="suggestions"></div>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <main id="main"></main>
  <footer>Data from Yahoo Finance via yfinance · may be delayed · not investment advice</footer>
</div>

<script>
const QUICK = ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "META", "TSLA", "JPM", "COST", "KO"];
const $ = (id) => document.getElementById(id);
let current = null;
let period = "1y";

// ---------- Formatters ----------
const isNum = (v) => typeof v === "number" && isFinite(v);
const NA = '<span class="na">—</span>';
const fmt = {
  num: (v, d = 2) => isNum(v) ? v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }) : NA,
  x: (v) => isNum(v) ? v.toFixed(2) + "x" : NA,
  pct: (v) => isNum(v) ? (v * 100).toFixed(2) + "%" : NA,         // 0.164 -> 16.40%
  pctRaw: (v) => isNum(v) ? v.toFixed(2) + "%" : NA,              // 0.32 -> 0.32%
  money: (v, cur = "USD") => {
    if (!isNum(v)) return NA;
    const sym = cur === "USD" ? "$" : "";
    const a = Math.abs(v), s = v < 0 ? "-" : "";
    if (a >= 1e12) return `${s}${sym}${(a / 1e12).toFixed(2)}T`;
    if (a >= 1e9) return `${s}${sym}${(a / 1e9).toFixed(2)}B`;
    if (a >= 1e6) return `${s}${sym}${(a / 1e6).toFixed(2)}M`;
    return `${s}${sym}${a.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
  },
  price: (v, cur = "USD") => isNum(v) ? (cur === "USD" ? "$" : "") + v.toFixed(2) : NA,
  signedPct: (v) => isNum(v) ? `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : ""}${(v * 100).toFixed(2)}%</span>` : NA,
  de: (v) => isNum(v) ? (v / 100).toFixed(2) + "x" : NA,           // Yahoo reports D/E as a percent
};

// ---------- Metric definitions (label, key, formatter, tooltip) ----------
const SECTIONS = [
  ["Valuation", [
    ["P/E (trailing)", "trailingPE", "x", "Price ÷ last 12 months of earnings per share."],
    ["P/E (forward)", "forwardPE", "x", "Price ÷ analysts' expected EPS for the next fiscal year."],
    ["PEG ratio", "trailingPegRatio", "x", "P/E ÷ expected earnings growth rate. Near 1 is often considered fairly valued."],
    ["Price / Sales", "priceToSalesTrailing12Months", "x", "Market cap ÷ trailing 12-month revenue."],
    ["Price / Book", "priceToBook", "x", "Price ÷ book value (assets minus liabilities) per share."],
    ["EV / EBITDA", "enterpriseToEbitda", "x", "Enterprise value ÷ EBITDA. Capital-structure-neutral valuation multiple."],
    ["EV / Revenue", "enterpriseToRevenue", "x", "Enterprise value ÷ revenue."],
  ]],
  ["Earnings per Share", [
    ["EPS (trailing)", "trailingEps", "price", "Net income per share over the last 12 months."],
    ["EPS (forward)", "forwardEps", "price", "Analysts' expected EPS for the next fiscal year."],
    ["EPS (current FY est.)", "epsCurrentYear", "price", "Analysts' EPS estimate for the current fiscal year."],
    ["Implied EPS growth", "_epsGrowth", "signedPct", "Forward EPS vs. trailing EPS."],
  ]],
  ["Growth", [
    ["Revenue growth (YoY qtr)", "revenueGrowth", "signedPct", "Most recent quarter's revenue vs. the same quarter a year ago."],
    ["Earnings growth (YoY qtr)", "earningsGrowth", "signedPct", "Most recent quarter's EPS vs. the same quarter a year ago."],
    ["Net income growth (YoY qtr)", "earningsQuarterlyGrowth", "signedPct", "Most recent quarter's net income vs. the same quarter a year ago."],
    ["Revenue growth (last FY)", "_annualRevGrowth", "signedPct", "Latest fiscal year's revenue vs. the prior fiscal year."],
  ]],
  ["Profitability", [
    ["Gross margin", "grossMargins", "pct", "(Revenue − cost of goods sold) ÷ revenue."],
    ["Operating margin", "operatingMargins", "pct", "Operating income ÷ revenue."],
    ["Net profit margin", "profitMargins", "pct", "Net income ÷ revenue."],
    ["Return on equity", "returnOnEquity", "pct", "Net income ÷ shareholders' equity."],
    ["Return on assets", "returnOnAssets", "pct", "Net income ÷ total assets."],
  ]],
  ["Financial Health", [
    ["Revenue (TTM)", "totalRevenue", "money", "Total revenue over the trailing 12 months."],
    ["EBITDA", "ebitda", "money", "Earnings before interest, taxes, depreciation & amortization."],
    ["Free cash flow", "freeCashflow", "money", "Operating cash flow minus capital expenditures."],
    ["Total cash", "totalCash", "money", "Cash and short-term investments."],
    ["Total debt", "totalDebt", "money", "Short- and long-term debt."],
    ["Debt / Equity", "debtToEquity", "de", "Total debt ÷ shareholders' equity."],
    ["Current ratio", "currentRatio", "x", "Current assets ÷ current liabilities. Above 1 means short-term obligations are covered."],
  ]],
  ["Dividends & Risk", [
    ["Dividend yield", "dividendYield", "pctRaw", "Annual dividend ÷ share price."],
    ["Dividend per share", "dividendRate", "price", "Annual dividend paid per share."],
    ["Payout ratio", "payoutRatio", "pct", "Share of earnings paid out as dividends."],
    ["Beta", "beta", "num", "Volatility vs. the overall market. 1 = moves with the market; above 1 = more volatile."],
    ["50-day average", "fiftyDayAverage", "price", "Average closing price over the last 50 trading days."],
    ["200-day average", "twoHundredDayAverage", "price", "Average closing price over the last 200 trading days."],
  ]],
];

// ---------- Search & autocomplete ----------
const input = $("q"), sug = $("suggestions");
let debounce, activeIdx = -1, sugItems = [];

const searchCache = {};   // query -> results, so Enter and the dropdown share one request
function searchFor(q) {
  const key = q.toLowerCase();
  if (!searchCache[key]) {
    searchCache[key] = fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => [])
      .then(res => { if (!Array.isArray(res) || !res.length) delete searchCache[key]; return Array.isArray(res) ? res : []; });
  }
  return searchCache[key];
}
function showNote(text) {
  sug.innerHTML = `<div class="suggestion note">${text}</div>`;
  sug.classList.add("open");
}
// Best match for what was typed: an exact ticker first, otherwise the top company result
function bestMatch(q, res) {
  const up = q.toUpperCase();
  return (res.find(r => r.symbol === up) || res[0] || null);
}

input.addEventListener("input", () => {
  clearTimeout(debounce);
  const q = input.value.trim();
  if (!q) return closeSug();
  sugItems = []; activeIdx = -1;
  showNote("Searching…");
  debounce = setTimeout(async () => {
    const res = await searchFor(q);
    if (input.value.trim() !== q) return;
    sugItems = res; activeIdx = res.length ? 0 : -1;   // top match is pre-selected, so Enter opens it
    if (!res.length) return showNote(`No matches for “${q.replace(/</g, "&lt;")}”. Try a ticker or a company name.`);
    sug.innerHTML = res.map((s, i) =>
      `<div class="suggestion ${i === 0 ? "active" : ""}" data-i="${i}"><b>${s.symbol}</b><span>${s.name ?? ""}</span><small>${s.exchange ?? ""} · ${s.type}</small></div>`).join("");
    sug.classList.add("open");
  }, 150);
});
input.addEventListener("keydown", async (e) => {
  const open = sug.classList.contains("open") && sugItems.length;
  if (e.key === "ArrowDown" && open) { activeIdx = Math.min(activeIdx + 1, sugItems.length - 1); highlight(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && open) { activeIdx = Math.max(activeIdx - 1, 0); highlight(); e.preventDefault(); }
  else if (e.key === "Enter") {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    if (open && activeIdx >= 0) return load(sugItems[activeIdx].symbol);
    // Suggestions not back yet (e.g. pressed Enter right after typing): wait for them, then open the best match
    clearTimeout(debounce);
    showNote("Searching…");
    const match = bestMatch(q, await searchFor(q));
    if (input.value.trim() !== q) return;
    if (match) return load(match.symbol);
    // No search match: only try it as a ticker if it looks like one (e.g. "BRK-B"), never a company name
    if (/^[A-Za-z]{1,5}([.-][A-Za-z]{1,2})?$/.test(q)) return load(q);
    showNote(`No matches for “${q.replace(/</g, "&lt;")}”. Try a ticker or a company name.`);
  } else if (e.key === "Escape") closeSug();
});
sug.addEventListener("mousedown", (e) => {
  const el = e.target.closest(".suggestion[data-i]");
  if (el) load(sugItems[+el.dataset.i].symbol);
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) closeSug(); });
function highlight() { [...sug.children].forEach((c, i) => c.classList.toggle("active", i === activeIdx)); }
function closeSug() { sug.classList.remove("open"); sugItems = []; }

$("chips").innerHTML = QUICK.map(s => `<button class="chip">${s}</button>`).join("");
$("chips").addEventListener("click", (e) => { if (e.target.classList.contains("chip")) load(e.target.textContent); });

// ---------- Load a stock ----------
async function load(symbol) {
  symbol = symbol.toUpperCase();
  closeSug(); input.value = ""; input.blur();
  history.replaceState(null, "", `#${symbol}`);
  $("main").innerHTML = `<div class="status"><div class="spinner"></div>Loading ${symbol}…</div>`;
  try {
    const res = await fetch(`/api/stock/${encodeURIComponent(symbol)}`);
    const d = await res.json();
    if (!res.ok || d.error) throw new Error(d.error || "Request failed");
    current = d;
    render(d);
    loadChart();
  } catch (err) {
    $("main").innerHTML = `<div class="status error">${err.message}<br><small style="color:var(--muted)">Try a valid ticker like AAPL or search by company name.</small></div>`;
  }
}

function render(d) {
  const cur = d.currency || "USD";
  const price = d.currentPrice ?? d.regularMarketPrice;
  const chg = d.regularMarketChange, chgPct = d.regularMarketChangePercent;
  const dir = (chg ?? 0) >= 0 ? "up" : "down";

  // Derived metrics
  d._epsGrowth = isNum(d.forwardEps) && isNum(d.trailingEps) && d.trailingEps > 0 ? d.forwardEps / d.trailingEps - 1 : null;
  const lastFY = d.annual?.length ? d.annual[d.annual.length - 1] : null;
  d._annualRevGrowth = lastFY?.revenueGrowth ?? null;

  // 52-week range position
  const lo = d.fiftyTwoWeekLow, hi = d.fiftyTwoWeekHigh;
  const pos = isNum(lo) && isNum(hi) && hi > lo ? Math.min(100, Math.max(0, (price - lo) / (hi - lo) * 100)) : null;

  const upside = isNum(d.targetMeanPrice) && isNum(price) ? d.targetMeanPrice / price - 1 : null;

  const formatVal = (key, f) => (f === "money" || f === "price") ? fmt[f](d[key], cur) : fmt[f](d[key]);

  $("main").innerHTML = `
    <div class="hero">
      <div>
        <h1>${d.longName || d.shortName || d.symbol}</h1>
        <div class="meta"><span class="tag">${d.symbol}</span> · ${d.exchange ?? ""} ${d.sector ? "· " + d.sector : ""} ${d.industry ? "· " + d.industry : ""}</div>
        ${d.dataSource === "snapshot" ? `<div class="meta" style="font-size:12px" title="Yahoo's company-metrics service doesn't answer cloud servers, so company details (description, beta, analyst targets, margins, debt) come from a saved snapshot taken ${d.snapshotDate}. Prices and price-based ratios (P/E, market cap, yield) are live.">Company details from a ${d.snapshotDate} snapshot · prices and P/E are live</div>`
          : d.dataSource === "fallback" ? `<div class="meta" style="font-size:12px" title="Yahoo's main company-metrics service doesn't answer cloud servers, so margins, growth, cash and debt are computed from the last four quarterly financial statements. Beta, analyst price targets and the company description aren't available in this mode; run the app locally for the full set.">Some metrics computed from quarterly financial statements (hosted mode) · may differ slightly from Yahoo's</div>` : ""}
      </div>
      <div class="price">
        <div class="now">${fmt.price(price, cur)}</div>
        <div class="chg ${dir}">${isNum(chg) ? (chg >= 0 ? "+" : "") + chg.toFixed(2) : ""} ${isNum(chgPct) ? `(${chgPct >= 0 ? "+" : ""}${chgPct.toFixed(2)}%)` : ""} today</div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile accent"><div class="k">P/E (TTM)</div><div class="v">${fmt.x(d.trailingPE)}</div></div>
      <div class="tile accent"><div class="k">Forward P/E</div><div class="v">${fmt.x(d.forwardPE)}</div></div>
      <div class="tile"><div class="k">EPS (TTM)</div><div class="v">${fmt.price(d.trailingEps, cur)}</div></div>
      <div class="tile"><div class="k">Forward EPS</div><div class="v">${fmt.price(d.forwardEps, cur)}</div></div>
      <div class="tile"><div class="k">Revenue growth</div><div class="v">${fmt.signedPct(d.revenueGrowth)}</div></div>
      <div class="tile"><div class="k">Market cap</div><div class="v">${fmt.money(d.marketCap, cur)}</div></div>
    </div>

    <div class="panel" id="valuation" style="margin-top:16px"><div class="mkt-loading" style="color:var(--muted)">Loading valuation history…</div></div>

    <div class="ai-panel">
      <div class="ai-head">
        <h3>AI summary</h3>
        <span class="hint">A plain-English read of ${d.symbol}'s valuation, growth, trend and risks, written from the numbers on this page.</span>
        <button class="ai-btn" id="aiExplain">Explain with AI</button>
      </div>
      <div id="aiOut"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="chart-head">
        <h3>Price history <span id="rangeChg" style="margin-left:8px;letter-spacing:0;text-transform:none"></span></h3>
        <div class="periods" id="periods">
          ${["1mo", "6mo", "ytd", "1y", "5y", "max"].map(p => `<button data-p="${p}" class="${p === period ? "on" : ""}">${p.toUpperCase()}</button>`).join("")}
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <svg id="chart"></svg>
      <div class="sub-head">
        <h3 title="Relative Strength Index (14-day). Above 70 is often read as overbought, below 30 as oversold.">RSI (14)</h3>
        <span class="rsi-now" id="rsiNow"></span>
      </div>
      <svg id="rsi"></svg>
      <div class="signals" id="signals"></div>
    </div>

    <div class="grid">
      ${SECTIONS.map(([title, rows]) => `
        <div class="panel">
          <h3>${title}</h3>
          ${rows.map(([label, key, f, tip]) => `
            <div class="metric"><span class="label" title="${tip}">${label}</span><span class="val">${formatVal(key, f)}</span></div>`).join("")}
        </div>`).join("")}

      <div class="panel">
        <h3>52-week range & analysts</h3>
        ${pos !== null ? `
          <div class="rangebar"><div class="dot" style="left:${pos}%"></div></div>
          <div class="rangelabels"><span>Low ${fmt.price(lo, cur)}</span><span>High ${fmt.price(hi, cur)}</span></div>` : ""}
        <div style="margin-top:14px">
          <div class="metric"><span class="label" title="Consensus analyst rating.">Analyst rating</span><span class="val">${d.recommendationKey && d.recommendationKey !== "none" ? `<span class="rec">${d.recommendationKey.replace("_", " ")}</span>` : NA}</span></div>
          <div class="metric"><span class="label" title="Average analyst 12-month price target.">Mean price target</span><span class="val">${fmt.price(d.targetMeanPrice, cur)}</span></div>
          <div class="metric"><span class="label" title="Low – high analyst price targets.">Target range</span><span class="val">${isNum(d.targetLowPrice) ? fmt.price(d.targetLowPrice, cur) + " – " + fmt.price(d.targetHighPrice, cur) : NA}</span></div>
          <div class="metric"><span class="label" title="Mean target vs. current price.">Implied upside</span><span class="val">${fmt.signedPct(upside)}</span></div>
          <div class="metric"><span class="label" title="Number of analysts covering the stock.">Analysts</span><span class="val">${d.numberOfAnalystOpinions ?? NA}</span></div>
        </div>
      </div>
    </div>

    ${d.annual?.length ? `
    <div class="panel" style="margin-top:16px">
      <h3>Annual financials</h3>
      <table>
        <thead><tr><th>Fiscal year</th><th>Revenue</th><th>Revenue growth</th><th>Net income</th><th>Net margin</th><th>Diluted EPS</th></tr></thead>
        <tbody>
          ${d.annual.slice().reverse().map(r => `
            <tr><td>${r.year}</td><td>${fmt.money(r.revenue, cur)}</td><td>${fmt.signedPct(r.revenueGrowth)}</td>
            <td>${fmt.money(r.netIncome, cur)}</td><td>${isNum(r.revenue) && isNum(r.netIncome) ? fmt.pct(r.netIncome / r.revenue) : NA}</td>
            <td>${fmt.price(r.eps, cur)}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>` : ""}

    ${d.longBusinessSummary ? `
    <div class="panel about" style="margin-top:16px">
      <h3>About</h3>
      ${d.longBusinessSummary}
      ${d.website ? `<p><a href="${d.website}" target="_blank" rel="noopener">${d.website}</a></p>` : ""}
    </div>` : ""}
  `;

  loadValuation(d.symbol);

  $("aiExplain").addEventListener("click", () =>
    runAgent(`/api/agent/explain/${encodeURIComponent(d.symbol)}`, {}, $("aiOut"), $("aiExplain"),
             `Reading ${d.symbol}'s numbers… (about 10 seconds)`));

  $("periods").addEventListener("click", (e) => {
    const p = e.target.dataset.p;
    if (!p) return;
    period = p;
    [...$("periods").children].forEach(b => b.classList.toggle("on", b.dataset.p === p));
    loadChart();
  });
}

// ---------- Price chart + moving averages + RSI (plain SVG) ----------
const MA_STYLE = {
  sma20:  { label: "20-day MA",  color: "#d97706", tip: "Average close over the last 20 trading days (~1 month). Short-term trend." },
  sma50:  { label: "50-day MA",  color: "#2563eb", tip: "Average close over the last 50 trading days (~1 quarter). Medium-term trend." },
  sma100: { label: "100-day MA", color: "#9333ea", tip: "Average close over the last 100 trading days (~5 months)." },
  sma200: { label: "200-day MA", color: "#1d1218", tip: "Average close over the last 200 trading days (~1 year). The classic long-term trend line." },
};
const maOn = { sma20: true, sma50: true, sma100: false, sma200: true };
let chartData = null;

async function loadChart() {
  if (!$("chart") || !current) return;
  const sym = current.symbol, p = period;
  $("chart").innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#76626c">Loading chart…</text>`;
  $("rsi").innerHTML = "";
  const res = await fetch(`/api/history/${encodeURIComponent(sym)}?period=${p}`).then(r => r.json()).catch(() => null);
  if (current.symbol !== sym || period !== p || !$("chart")) return;
  chartData = res && Array.isArray(res.points) ? res : { points: [], latest: null };
  renderLegend();
  renderSignals();
  drawCharts();
}

function renderLegend() {
  const latest = chartData.latest || {};
  const cur = current.currency || "USD";
  $("legend").innerHTML =
    `<button style="cursor:default"><i style="background:#e0197d"></i>Price <small>${fmt.price(latest.close, cur)}</small></button>` +
    Object.entries(MA_STYLE).map(([k, s]) =>
      `<button data-ma="${k}" class="${maOn[k] ? "" : "off"}" title="${s.tip} Click to toggle.">
        <i style="background:${s.color}"></i>${s.label} <small>${fmt.price(latest[k], cur)}</small></button>`).join("");
  $("legend").onclick = (e) => {
    const b = e.target.closest("button[data-ma]");
    if (!b) return;
    maOn[b.dataset.ma] = !maOn[b.dataset.ma];
    b.classList.toggle("off", !maOn[b.dataset.ma]);
    drawCharts();
  };
}

function renderSignals() {
  const L = chartData.latest || {};
  const rel = (a, b) => isNum(a) && isNum(b) ? a / b - 1 : null;
  const vsMA = (k) => {
    const r = rel(L.close, L[k]);
    return r === null ? NA : `<span class="${r >= 0 ? "up" : "down"}">${(Math.abs(r) * 100).toFixed(1)}% ${r >= 0 ? "above" : "below"}</span>`;
  };
  let rsiLabel = NA, rsiShort = "";
  if (isNum(L.rsi)) {
    const zone = L.rsi >= 70 ? ["Overbought", "pink"] : L.rsi <= 30 ? ["Oversold", "pink"] : ["Neutral", ""];
    rsiLabel = `${L.rsi.toFixed(1)} <span class="${zone[1]}" style="font-weight:600">· ${zone[0]}</span>`;
    rsiShort = rsiLabel;
  }
  let trend = NA;
  if (isNum(L.sma50) && isNum(L.sma200)) {
    trend = L.sma50 >= L.sma200
      ? `<span class="up">Bullish · 50-day above 200-day</span>`
      : `<span class="down">Bearish · 50-day below 200-day</span>`;
  }
  $("rsiNow").innerHTML = rsiShort;
  $("signals").innerHTML = [
    ["RSI (14)", rsiLabel, "Momentum on a 0–100 scale. ≥70 often read as overbought, ≤30 as oversold."],
    ["Price vs 20-day", vsMA("sma20"), "Where today's price sits relative to its short-term average."],
    ["Price vs 50-day", vsMA("sma50"), "Where today's price sits relative to its medium-term average."],
    ["Price vs 200-day", vsMA("sma200"), "Trading above the 200-day is commonly viewed as a long-term uptrend."],
    ["50 / 200 trend", trend, "50-day crossing above the 200-day is a 'golden cross'; below is a 'death cross'."],
  ].map(([k, v, tip]) => `<div class="signal"><div class="k" title="${tip}">${k}</div><div class="v">${v}</div></div>`).join("");
}

function drawCharts() {
  const svg = $("chart"), rsiSvg = $("rsi");
  if (!svg || !chartData) return;
  const pts = chartData.points;
  const W = svg.clientWidth || 1000, H = 300, padL = 56, padR = 12, padT = 14, padB = 10;
  const RH = 160, rPadT = 8, rPadB = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  rsiSvg.setAttribute("viewBox", `0 0 ${W} ${RH}`);
  if (pts.length < 2) {
    svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#76626c">No price data</text>`;
    rsiSvg.innerHTML = "";
    return;
  }
  const cur = current.currency || "USD";
  const activeMAs = Object.keys(MA_STYLE).filter(k => maOn[k]);

  // Y scale (log scale for "max" so decades of growth stay readable)
  const useLog = period === "max";
  const tf = useLog ? Math.log : (v) => v, inv = useLog ? Math.exp : (v) => v;
  const vals = pts.flatMap(p => [p.close, ...activeMAs.map(k => p[k])]).filter(v => isNum(v) && v > 0).map(tf);
  let tmin = Math.min(...vals), tmax = Math.max(...vals);
  const pad = (tmax - tmin) * 0.06 || 1; tmin -= pad; tmax += pad;
  const X = (i) => padL + (i / (pts.length - 1)) * (W - padL - padR);
  const Y = (v) => padT + (1 - (tf(v) - tmin) / (tmax - tmin)) * (H - padT - padB);
  const RY = (v) => rPadT + (1 - v / 100) * (RH - rPadT - rPadB);

  // Build an SVG path, breaking the line wherever a value is missing (e.g. MA warm-up)
  const pathFor = (key, yFn) => {
    let d = "", pen = false;
    pts.forEach((p, i) => {
      const v = p[key];
      if (!isNum(v) || (useLog && key !== "rsi" && v <= 0)) { pen = false; return; }
      d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${yFn(v).toFixed(1)}`;
      pen = true;
    });
    return d;
  };

  // ---- Price chart ----
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const t = tmin + (tmax - tmin) * (i / 4), v = inv(t), y = Y(v);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="#efdbe5" stroke-dasharray="3 4"/>
             <text x="${padL - 8}" y="${y + 4}" text-anchor="end" fill="#76626c" font-size="11">${v < 10 ? v.toFixed(2) : v.toFixed(0)}</text>`;
  }
  const pricePath = pathFor("close", Y);
  const area = `${pricePath} L${X(pts.length - 1)},${H - padB} L${padL},${H - padB} Z`;
  const closes = pts.map(p => p.close);
  const change = closes[closes.length - 1] / closes[0] - 1;
  $("rangeChg").innerHTML = `<span class="${change >= 0 ? "up" : "down"}">${change >= 0 ? "+" : ""}${(change * 100).toFixed(2)}% (${period.toUpperCase()})</span>${useLog ? ' <span style="color:var(--muted);font-weight:500">· log scale</span>' : ""}`;
  const maPaths = activeMAs.map(k =>
    `<path d="${pathFor(k, Y)}" fill="none" stroke="${MA_STYLE[k].color}" stroke-width="1.5" stroke-opacity="0.9"/>`).join("");

  svg.innerHTML = `
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0197d" stop-opacity="0.28"/><stop offset="100%" stop-color="#e0197d" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#g)"/>
    ${maPaths}
    <path d="${pricePath}" fill="none" stroke="#e0197d" stroke-width="2.2" stroke-linejoin="round"/>
    <g class="hov" style="display:none">
      <line class="hl" y1="${padT}" y2="${H - padB}" stroke="#ec5a9e" stroke-width="1"/>
      <circle class="hc" r="5" fill="#e0197d" stroke="#ffffff" stroke-width="2"/>
      <g class="tip"><rect rx="8" fill="#fdf3f8" stroke="#f2a3c7"/><text class="chart-tip"></text></g>
    </g>
    <rect class="hit" x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent"/>`;

  // ---- RSI chart ----
  let xLabels = "";
  const nLab = W < 560 ? 3 : 5;   // fewer date labels on narrow (phone) screens so they don't overlap
  for (let i = 0; i < nLab; i++) {
    const idx = Math.round(i * (pts.length - 1) / (nLab - 1));
    xLabels += `<text x="${X(idx)}" y="${RH - 5}" text-anchor="${i === 0 ? "start" : i === nLab - 1 ? "end" : "middle"}" fill="#76626c" font-size="11">${pts[idx].date}</text>`;
  }
  rsiSvg.innerHTML = `
    <rect x="${padL}" y="${RY(70)}" width="${W - padL - padR}" height="${RY(30) - RY(70)}" fill="#e0197d" fill-opacity="0.06"/>
    ${[70, 50, 30].map(v => `
      <line x1="${padL}" x2="${W - padR}" y1="${RY(v)}" y2="${RY(v)}" stroke="${v === 50 ? "#efdbe5" : "#f2a3c7"}" stroke-dasharray="3 4"/>
      <text x="${padL - 8}" y="${RY(v) + 4}" text-anchor="end" fill="#76626c" font-size="11">${v}</text>`).join("")}
    <path d="${pathFor("rsi", RY)}" fill="none" stroke="#ec5a9e" stroke-width="1.6"/>
    ${xLabels}
    <g class="hov" style="display:none">
      <line class="hl" y1="${rPadT}" y2="${RH - rPadB}" stroke="#ec5a9e" stroke-width="1"/>
      <circle class="hc" r="4" fill="#ec5a9e" stroke="#ffffff" stroke-width="2"/>
    </g>
    <rect class="hit" x="${padL}" y="0" width="${W - padL - padR}" height="${RH}" fill="transparent"/>`;

  // ---- Shared hover crosshair + tooltip ----
  const set = (el, attrs) => Object.entries(attrs).forEach(([a, v]) => el.setAttribute(a, v));
  const show = (i) => {
    const p = pts[i], x = X(i);
    for (const s of [svg, rsiSvg]) s.querySelector(".hov").style.display = "";
    set(svg.querySelector(".hl"), { x1: x, x2: x });
    set(svg.querySelector(".hc"), { cx: x, cy: Y(p.close) });
    const rc = rsiSvg.querySelector(".hc");
    set(rsiSvg.querySelector(".hl"), { x1: x, x2: x });
    if (isNum(p.rsi)) { rc.style.display = ""; set(rc, { cx: x, cy: RY(p.rsi) }); } else rc.style.display = "none";

    const lines = [[p.date, "#76626c"], [`Close  ${fmt.price(p.close, cur)}`, "#e0197d"]];
    activeMAs.forEach(k => { if (isNum(p[k])) lines.push([`${MA_STYLE[k].label}  ${fmt.price(p[k], cur)}`, MA_STYLE[k].color]); });
    if (isNum(p.rsi)) lines.push([`RSI  ${p.rsi.toFixed(1)}`, "#ec5a9e"]);
    const text = svg.querySelector(".tip text");
    text.innerHTML = lines.map(([t, c], j) => `<tspan x="0" dy="${j ? 17 : 0}" fill="${c}">${t}</tspan>`).join("");
    const tw = Math.max(...lines.map(([t]) => t.length)) * 6.8 + 20, th = lines.length * 17 + 12;
    const tx = x + 14 + tw > W - padR ? x - 14 - tw : x + 14;
    set(svg.querySelector(".tip rect"), { x: tx, y: padT + 24, width: tw, height: th });
    text.querySelectorAll("tspan").forEach(t => t.setAttribute("x", tx + 10));
    set(text, { x: tx + 10, y: padT + 24 + 20 });
  };
  const hide = () => { for (const s of [svg, rsiSvg]) s.querySelector(".hov").style.display = "none"; };
  for (const s of [svg, rsiSvg]) {
    const hit = s.querySelector(".hit");
    hit.addEventListener("mousemove", (e) => {
      const r = s.getBoundingClientRect();
      const mx = (e.clientX - r.left) * (W / r.width);
      show(Math.max(0, Math.min(pts.length - 1, Math.round((mx - padL) / (W - padL - padR) * (pts.length - 1)))));
    });
    hit.addEventListener("mouseleave", hide);
  }
}

window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(drawCharts, 200); });

// Start with ticker from URL hash, or AAPL
// ---------- Valuation vs. its own 5-year history (from the P/E screener's latest snapshot) ----------
// 1 → 1st, 2 → 2nd, 3 → 3rd, 11 → 11th, 22 → 22nd
const ordinal = (n) => { const v = Math.round(n), t = v % 100;
  return v + (t >= 11 && t <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" })[v % 10] || "th"); };
const zoneOf = (p) => !isNum(p) ? "na" : p >= 80 ? "hi" : p <= 20 ? "lo" : "mid";
let valData = null, valChart = "trailing";

async function loadValuation(sym) {
  const res = await fetch(`/api/valuation/${encodeURIComponent(sym)}`).catch(() => null);
  if (!current || current.symbol !== sym || !$("valuation")) return;
  if (!res || !res.ok) {
    $("valuation").innerHTML = `<div class="val-head"><h3>Valuation vs. its own history</h3></div>
      <div class="val-foot">${sym} isn't one of the screener's 516 stocks (S&amp;P 500, Nasdaq-100, Dow 30), so there's no 5-year P/E history for it yet.</div>`;
    return;
  }
  valData = await res.json();
  renderValuation();
}

function renderValuation() {
  const v = valData;
  const M = [["Trailing P/E", v.pe, v.percentile, v.peMedian, v.peMin, v.peMax, (x) => x.toFixed(1) + "x"],
             ["Forward P/E", v.fwdPE, v.fwdPctile, v.fwdMedian, v.fwdMin, v.fwdMax, (x) => x.toFixed(1) + "x"],
             ["PEG", v.peg, v.pegPctile, v.pegMedian, v.pegMin, v.pegMax, (x) => x.toFixed(2)]];
  const zones = M.map(m => zoneOf(m[2]));
  const nHi = zones.filter(z => z === "hi").length, nLo = zones.filter(z => z === "lo").length, nScored = zones.filter(z => z !== "na").length;
  const verdict = nHi >= 2 ? ["hi", `Expensive vs. its own history on ${nHi === 3 ? "all 3" : "2 of 3"} measures`]
                : nLo >= 2 ? ["lo", `Cheap vs. its own history on ${nLo === 3 ? "all 3" : "2 of 3"} measures`]
                : nHi === 1 && nLo === 0 ? ["hi", "Expensive on one measure; the others are in their normal range"]
                : nLo === 1 && nHi === 0 ? ["lo", "Cheap on one measure; the others are in their normal range"]
                : nScored ? ["mid", "Within its normal range vs. its own history"] : ["mid", "Not enough history to judge"];
  const card = ([label, now, pct, med, lo, hi, f], z) => `
    <div class="vcard ${z}"><div class="k">${label}</div>
      <div class="row"><span class="now">${isNum(now) ? f(now) : "n/m"}</span><span class="pc">${isNum(pct) ? ordinal(pct) : "—"}</span></div>
      <div class="bar"><span style="width:${isNum(pct) ? Math.max(pct, 2) : 0}%"></span></div>
      <div class="sub">${isNum(med) ? `5Y median ${f(med)}` : ""}${isNum(lo) && isNum(hi) ? ` · range ${f(lo)}–${f(hi)}` : ""}${!isNum(pct) && label !== "Trailing P/E" && v.fwdNote ? " · short history" : ""}</div>
    </div>`;
  $("valuation").innerHTML = `
    <div class="val-head"><h3>Valuation vs. its own 5-year history</h3><span class="verdict ${verdict[0]}">${verdict[1]}</span></div>
    <div class="val-cards">${M.map((m, i) => card(m, zones[i])).join("")}</div>
    <div class="val-charts">
      <div><h4>${valChart === "trailing" ? "Trailing" : "Forward"} P/E over 5 years
        <span class="mini-seg"><button data-vc="trailing" class="${valChart === "trailing" ? "on" : ""}">Trailing</button><button data-vc="forward" class="${valChart === "forward" ? "on" : ""}" ${v.fwdSpark && v.fwdSpark.length > 1 ? "" : "disabled"}>Forward</button></span></h4>
        <svg id="peChart"></svg></div>
      <div><h4>Trailing P/E percentile, week by week (past year)</h4><svg id="pctChart"></svg></div>
    </div>
    <div class="val-foot">Percentile = share of the past 5 years with a value at or below today's · ≥80th expensive, ≤20th cheap ·
      snapshot ${v.snapshot}${v.ibesAsOf ? ` · forward data I/B/E/S ${v.ibesAsOf}` : ""} · <a href="/screener#trailing-all">Compare in the P/E Screener →</a></div>`;
  $("valuation").querySelectorAll("[data-vc]").forEach(b => b.addEventListener("click", () => { valChart = b.dataset.vc; renderValuation(); }));
  drawPeChart(valChart === "trailing" ? v.spark : (v.fwdSpark || []).concat(isNum(v.fwdPE) ? [v.fwdPE] : []),
              valChart === "trailing" ? v.peMedian : v.fwdMedian);
  drawPctChart(v.pctHistory || []);
}

function drawPeChart(vals, med) {
  const svg = $("peChart"), W = svg.clientWidth || 600, H = 170, L = 42, R = 10, T = 10, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const v = (vals || []).filter(isNum);
  if (v.length < 2) { svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#76626c" font-size="12">No history</text>`; return; }
  let lo = Math.min(...v, med ?? Infinity), hi = Math.max(...v, med ?? -Infinity);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = (i) => L + i / (vals.length - 1) * (W - L - R), Y = (y) => T + (1 - (y - lo) / (hi - lo)) * (H - T - B);
  let d = "", pen = false;
  vals.forEach((y, i) => { if (!isNum(y)) { pen = false; return; } d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(y).toFixed(1)}`; pen = true; });
  const last = vals[vals.length - 1];
  svg.innerHTML = `
    ${[hi - pad, (hi + lo) / 2, lo + pad].map(t => `<text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end" fill="#76626c" font-size="10.5">${t.toFixed(t < 10 ? 1 : 0)}x</text>`).join("")}
    ${isNum(med) ? `<line x1="${L}" x2="${W - R}" y1="${Y(med)}" y2="${Y(med)}" stroke="#76626c" stroke-dasharray="4 4"/>
      <text x="${W - R}" y="${Y(med) - 4}" text-anchor="end" fill="#76626c" font-size="10.5">5Y median ${med.toFixed(1)}x</text>` : ""}
    <path d="${d}" fill="none" stroke="#e0197d" stroke-width="1.8"/>
    ${isNum(last) ? `<circle cx="${X(vals.length - 1)}" cy="${Y(last)}" r="4" fill="#e0197d" stroke="#fff" stroke-width="2"/>` : ""}
    <text x="${L}" y="${H - 5}" fill="#76626c" font-size="10.5">5 years ago</text>
    <text x="${W - R}" y="${H - 5}" text-anchor="end" fill="#76626c" font-size="10.5">today</text>`;
}

function drawPctChart(pts) {
  const svg = $("pctChart"), W = svg.clientWidth || 400, H = 170, L = 34, R = 10, T = 10, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (pts.length < 2) { svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#76626c" font-size="12">Not enough history (needs 3+ years of earnings)</text>`; return; }
  const X = (i) => L + i / (pts.length - 1) * (W - L - R), Y = (p) => T + (1 - p / 100) * (H - T - B);
  const d = pts.map(([, p], i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join("");
  const [lastDate, lastP] = pts[pts.length - 1];
  svg.innerHTML = `
    <rect x="${L}" y="${Y(100)}" width="${W - L - R}" height="${Y(80) - Y(100)}" fill="#e0197d" fill-opacity="0.08"/>
    <rect x="${L}" y="${Y(20)}" width="${W - L - R}" height="${Y(0) - Y(20)}" fill="#15803d" fill-opacity="0.08"/>
    ${[100, 80, 50, 20, 0].map(p => `<text x="${L - 6}" y="${Y(p) + 4}" text-anchor="end" fill="#76626c" font-size="10.5">${p}</text>
      <line x1="${L}" x2="${W - R}" y1="${Y(p)}" y2="${Y(p)}" stroke="#efdbe5" ${p === 50 ? 'stroke-dasharray="3 4"' : ""}/>`).join("")}
    <text x="${L + 4}" y="${Y(100) + 12}" fill="#e0197d" font-size="10">expensive</text>
    <text x="${L + 4}" y="${Y(0) - 4}" fill="#15803d" font-size="10">cheap</text>
    <path d="${d}" fill="none" stroke="#1d1218" stroke-width="1.8"/>
    <circle cx="${X(pts.length - 1)}" cy="${Y(lastP)}" r="4" fill="${lastP >= 80 ? "#e0197d" : lastP <= 20 ? "#15803d" : "#1d1218"}" stroke="#fff" stroke-width="2"/>
    <text x="${L}" y="${H - 5}" fill="#76626c" font-size="10.5">${pts[0][0]}</text>
    <text x="${W - R}" y="${H - 5}" text-anchor="end" fill="#76626c" font-size="10.5">${lastDate}</text>`;
}

// Open the stock in the link (e.g. /stock#MSFT); otherwise open today's most-watched stock (from the Market page data)
const startSymbol = decodeURIComponent(location.hash.slice(1));
if (startSymbol) {
  load(startSymbol);
} else {
  $("main").innerHTML = `<div class="status"><div class="spinner"></div>Opening today's most-watched stock…</div>`;
  fetch("/api/market/today").then(r => r.json()).catch(() => null)
    .then(d => load(d && d.attention && d.attention.length ? d.attention[0].symbol : "AAPL"));
}
</script>
